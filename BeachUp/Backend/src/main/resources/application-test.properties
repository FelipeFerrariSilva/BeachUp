spring.datasource.url=jdbc:postgresql://localhost:5432/beachup
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
api.security.token.secret=${JWT_SECRET:my-secret-key}
api.security.token.issuer=auth-api

#  MERCADO PAGO
mp.access-token=placeholder
mp.public-key=placeholder
mp.success-url=${MP_SUCCESS_URL:http://localhost:4200/plano/sucesso}
mp.failure-url=${MP_FAILURE_URL:http://localhost:4200/plano/falha}
mp.pending-url=${MP_PENDING_URL:http://localhost:4200/plano/pendente}

# OAuth Marketplace (split na reserva)
mp.client-id=placeholder
mp.client-secret=placeholder
mp.redirect-uri=${MP_REDIRECT_URI:http://localhost:8080/pagamentos/oauth/callback}

# URL do webhook
mp.webhook-url=${MP_WEBHOOK_URL:http://localhost:8080/pagamentos/webhook}

# EMAIL (desabilitado em teste)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder@gmail.com}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:http://localhost:4200}