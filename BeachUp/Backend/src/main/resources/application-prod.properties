
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=auth-api

# MERCADO PAGO

mp.access-token=${MP_ACCESS_TOKEN}
mp.public-key=${MP_PUBLIC_KEY}
mp.success-url=${MP_SUCCESS_URL}
mp.failure-url=${MP_FAILURE_URL}
mp.pending-url=${MP_PENDING_URL}
mp.client-id=${MP_CLIENT_ID}
mp.client-secret=${MP_CLIENT_SECRET}
mp.redirect-uri=${MP_REDIRECT_URI}
mp.webhook-url=${MP_WEBHOOK_URL}

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.debug=false


app.frontend-url=${FRONTEND_URL}


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# SERVIDOR ? Railway define a porta via $PORT

server.port=${PORT:8080}